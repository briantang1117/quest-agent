brokerClusterName=QuestLanCluster
brokerName=quest-broker
brokerId=0
# 必须为应用服务器/开发机可达的NAS固定内网IP，不是容器名/127.0.0.1。
# RocketMQ配置不展开.env变量，改NAS地址时必须同时改这里与.env。
brokerIP1=192.168.3.40
listenPort=10911
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
storePathRootDir=/home/rocketmq/store
storePathCommitLog=/home/rocketmq/store/commitlog
# 单机开发、无副本，关掉默认多副本写入前提；不具备高可用保证。
enableControllerMode=false
enableDLegerCommitLog=false
# 兼容低配NAS，避免默认预热/锁内存要求。
warmMapedFileEnable=false
transientStorePoolEnable=false
# 业务Topic必须显式创建，禁止客户端随意自动建Topic。
autoCreateTopicEnable=false
autoCreateSubscriptionGroup=true
deleteWhen=04
fileReservedTime=72
# 当前开发配置不启用ACL，必须配置NAS网络防火墙，不可公网暴露。
aclEnable=false
