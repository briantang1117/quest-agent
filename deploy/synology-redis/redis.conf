# 容器内部监听；宿主机发布接口与端口由 Compose 限定。
bind 0.0.0.0
port 6379
protected-mode yes

# 容器以前台主进程运行，日志交给 Docker 轮转。
daemonize no
loglevel notice
logfile ""

# 独立持久化目录，绝不能与已有 Redis 共用。
dir /data
dbfilename dump.rdb
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes

# RDB 辅助快照，不能替代独立备份。
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

# 兼放认证状态、限流和防重放键，不允许内存满时随意驱逐安全状态。
# 内存不足时写入会失败，应用必须正确处理，不能直接切为 allkeys-lru。
maxmemory 256mb
maxmemory-policy noeviction

# maxmemory 不包含全部进程开销，Compose 另留 512MB 容器额度。
maxclients 1000
timeout 0
tcp-keepalive 300

# 单实例下逻辑库不等于权限隔离；本期统一使用 DB 0。
databases 16
