# 群晖 x86_64 独立 Redis 项目，将本目录整体上传并填写 .env。
services:
  redis:
    image: redis:7.4.12-alpine
    platform: linux/amd64
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 512m
    environment:
      TZ: UTC
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请填写独立 Redis 强密码}
    ports:
      - '${REDIS_BIND_IP:?请填写群晖局域网 IP}:${REDIS_PORT:-16379}:6379'
    volumes:
      - ./data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    # redis.conf 不做环境变量替换，认证参数显式传入。
    # 再调用官方 entrypoint，保留 data 权限初始化与降权运行逻辑。
    command:
      - sh
      - -ec
      - 'exec /usr/local/bin/docker-entrypoint.sh redis-server /usr/local/etc/redis/redis.conf --requirepass "$$REDIS_PASSWORD"'
    healthcheck:
      # 使用环境变量认证，避免 redis-cli -a 的密码警告；必须实际返回 PONG。
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --raw ping | grep -qx PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
