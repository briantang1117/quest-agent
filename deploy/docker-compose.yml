name: quest-agent

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: quest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?请配置 PG_ADMIN_PASSWORD}
      PG_OWNER_PASSWORD: ${PG_OWNER_PASSWORD:?请配置 PG_OWNER_PASSWORD}
      PG_APP_PASSWORD: ${PG_APP_PASSWORD:?请配置 PG_APP_PASSWORD}
      PG_AI_PASSWORD: ${PG_AI_PASSWORD:?请配置 PG_AI_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d quest']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请配置 REDIS_PASSWORD}
    command: [sh, -ec, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redisdata:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: '-Xms128m -Xmx128m -Xmn64m'
    restart: unless-stopped

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf
    environment:
      JAVA_OPT_EXT: '-Xms256m -Xmx256m -Xmn128m'
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
      - rocketmq-store:/home/rocketmq/store
    depends_on:
      - rocketmq-namesrv
    restart: unless-stopped

  ai-service:
    build: ../backend/ai-python
    environment:
      APP_ENV: production
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?请配置 INTERNAL_SERVICE_TOKEN}
      INTERNAL_HMAC_SECRET: ${INTERNAL_HMAC_SECRET:?请配置 INTERNAL_HMAC_SECRET}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    # 不发布宿主机端口，终端无法通过网关绕过 Java。
    restart: unless-stopped

  api-java:
    build:
      context: ../backend
      dockerfile: api-java/Dockerfile
    image: quest-api:dev
    environment:
      SPRING_PROFILES_ACTIVE: deployment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/quest
      SPRING_DATASOURCE_USERNAME: quest_app
      SPRING_DATASOURCE_PASSWORD: ${PG_APP_PASSWORD:?请配置 PG_APP_PASSWORD}
      SPRING_FLYWAY_USER: quest_owner
      SPRING_FLYWAY_PASSWORD: ${PG_OWNER_PASSWORD:?请配置 PG_OWNER_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请配置 JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请配置 REDIS_PASSWORD}
      AI_SERVICE_URL: http://ai-service:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?请配置 INTERNAL_SERVICE_TOKEN}
      INTERNAL_HMAC_SECRET: ${INTERNAL_HMAC_SECRET:?请配置 INTERNAL_HMAC_SECRET}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://nas.quest.lan:9000}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://nas.quest.lan:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
    volumes:
      - ./migrations:/opt/quest/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-java:
    build:
      context: ../backend
      dockerfile: worker-java/Dockerfile
    image: quest-worker:dev
    environment:
      SPRING_PROFILES_ACTIVE: deployment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/quest
      SPRING_DATASOURCE_USERNAME: quest_app
      SPRING_DATASOURCE_PASSWORD: ${PG_APP_PASSWORD:?请配置 PG_APP_PASSWORD}
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      AI_SERVICE_URL: http://ai-service:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?请配置 INTERNAL_SERVICE_TOKEN}
      INTERNAL_HMAC_SECRET: ${INTERNAL_HMAC_SECRET:?请配置 INTERNAL_HMAC_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      api-java:
        condition: service_started
      rocketmq-broker:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - '127.0.0.1:${HTTP_PORT:-8088}:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/pc-web/dist:/usr/share/nginx/html:ro
      - ../frontend/mobile-agent/dist:/usr/share/nginx/html/m:ro
    depends_on:
      - api-java
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  rocketmq-store:
