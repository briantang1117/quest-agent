server {
    listen 80;
    server_name quest.lan localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://api-java:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖客户端自带值；后端仅在精确可信代理配置下使用此来源。
        proxy_set_header X-Quest-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 仅暴露存活探针；不转发完整 actuator 信息。
    location = /actuator/health {
        proxy_pass http://api-java:8080;
    }
    location /internal/ { return 404; }
    location /actuator/ { return 404; }
    location = /m { return 302 /m/; }
    location /m/ { try_files $uri $uri/ /m/index.html; }
    location / { try_files $uri $uri/ /index.html; }
}
