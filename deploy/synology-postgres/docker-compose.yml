# 群晖 Container Manager 独立项目；将整个目录上传后配置 .env。
# 使用项目既定 PostgreSQL16，不复用/覆盖已有 PostgreSQL 数据目录。
services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16
    platform: linux/amd64
    restart: unless-stopped
    stop_grace_period: 60s
    shm_size: '256mb'
    environment:
      TZ: UTC
      POSTGRES_DB: quest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?请填写 PostgreSQL 管理员密码}
      PG_OWNER_PASSWORD: ${PG_OWNER_PASSWORD:?请填写迁移账号密码}
      PG_APP_PASSWORD: ${PG_APP_PASSWORD:?请填写业务账号密码}
      PG_AI_PASSWORD: ${PG_AI_PASSWORD:?请填写 AI 索引账号密码}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C.UTF-8 --auth-host=scram-sha-256'
    ports:
      # 必须填写 NAS 的固定局域网 IPv4，避免默认暴露全部网络接口。
      - '${PG_BIND_IP:?请填写 NAS 局域网 IP}:${PG_PORT:-5432}:5432'
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - password_encryption=scram-sha-256
      - -c
      - timezone=UTC
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - work_mem=4MB
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=200
      - -c
      - log_timezone=UTC
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
